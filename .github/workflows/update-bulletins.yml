name: 소식지 목록 자동 갱신
on:
  push:
    branches: [main]
    paths:
      - 'bulletins/**'
      - '.github/workflows/update-bulletins.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 소식지 목록 만들기
        run: python3 scripts/build_bulletins.py
      - name: 변경사항 저장
        run: |
          if ! git diff --quiet -- bulletins.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bulletins.json
            git commit -m "소식지 목록 자동 갱신"
            git push
          fi
